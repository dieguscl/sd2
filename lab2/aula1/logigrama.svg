<text x="20" y="160" class="p" text-anchor="start">Realimentações (verde): as saídas</text>
<text x="20" y="175" class="p" text-anchor="start">Q dos FF (S0…S5) voltam às portas</text>
<text x="20" y="190" class="p" text-anchor="start">do estado seguinte.</text>
<text x="20" y="210" class="p" text-anchor="start">/Start, /Tempo: saídas dos inversores.</text>
<text x="20" y="230" class="p" text-anchor="start">Relógio: CLKBasys (100 MHz) em todos os FF.</text>
<text x="20" y="245" class="p" text-anchor="start">Reset: saída do SincronizadorReset</text>
<text x="20" y="260" class="p" text-anchor="start">(PRE do FF_S0, CLR dos outros).</text>
<text x="20" y="285" class="p" text-anchor="start">AND = decisão (estado · condição),</text>
<text x="20" y="300" class="p" text-anchor="start">OR = reunião dos percursos que</text>
<text x="20" y="315" class="p" text-anchor="start">entram no mesmo estado.</text>
<text x="20" y="340" class="p" text-anchor="start">Cinzento: nome da instância em</text>
<text x="20" y="355" class="p" text-anchor="start">controlador/controlador.v.</text>
